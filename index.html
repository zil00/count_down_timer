<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>countdown</title>
        <link rel="stylesheet" href="style.css"/>
        <script src="countdown.js" defer></script>
    </head>
    <body>
        <div class="heading">
            <h1>Counting Down to: CMPT Final Exam</h1>
        </div>
        <form action="countdown.js" id="myform">
            <label for="">Choose a Time  and Date</label>
            <input type="date" id="date">
            <label for="">Name the event</label>
            <input type="text" id="name">
            <input type="submit" value="submit" >
        </form>
        <div class="container">
            <div class="timer">
                <div class="days">
                    <p class="title">days</p>
                    <p class="num" id="one">00</p>
                </div>
                <div class="hours">
                    <p class="title" >hours</p>
                    <p class="num" id="two">00</p>
                </div>
                <div class="minutes">
                    <p class="title">minutes</p>
                    <p class="num" id="three">00</p>
                </div>
                <div class="seconds">
                    <p class="title">seconds</p>
                    <p class="num" id="four">00</p>
                </div>
            </div>
        </div>
    </body>
</html>
