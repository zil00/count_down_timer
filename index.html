<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>countdown</title>
        <link rel="stylesheet" href="style.css"/>
        <script> src="/home/sharzil/Desktop/count_down_timer/countdown.js"</script>
    </head>
    <body>
        <div class="heading">
            <h1>Counting Down to: CMPT Final Exam</h1>
        </div>
        <form action="countdown.js">
            <label for="">Choose a Time  and Date</label>
            <input type="date">
            <label for="">Name the event</label>
            <input type="text">
            <input type="submit" value="submit">
        </form>
        <div class="container">
            <div class="timer">
                <div class="days">00</div>
                <div class="hours">00</div>
                <div class="minutes">00</div>
                <div class="seconds">00</div>
            </div>
        </div>
    </body>
